<!doctype html>
<html><head><meta charset="utf-8"><title>GTA6IRL.com · We'll Be Right Back</title>
<style>
@font-face{font-family:'Inter';src:url('assets/brb/Inter.ttf') format('truetype');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#1a0b25}
body{font-family:'Inter',system-ui,sans-serif;color:#fff;position:relative}
.bg{position:absolute;top:0;left:0;width:3240px;height:1080px;
  background:url('assets/brb/miami_1500x500.png') center/cover no-repeat;
  transform-origin:50% 60%;animation:drift 60s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{0%{transform:translate3d(-240px,0,0) scale(1.04)}100%{transform:translate3d(-1080px,-20px,0) scale(1.10)}}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,146,20,.62) 0%,rgba(255,92,95,.60) 36%,rgba(247,57,120,.62) 50%,rgba(192,42,186,.62) 78%,rgba(140,45,230,.66) 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 40%,rgba(20,0,30,.45) 100%)}
.sun{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 20%,rgba(255,230,160,.35),rgba(255,230,160,0) 45%);
  animation:sun 14s ease-in-out infinite alternate;will-change:opacity,transform}
@keyframes sun{0%{opacity:.4;transform:translateX(0)}100%{opacity:1;transform:translateX(80px)}}
.col{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding-bottom:40px}
.logo{height:150px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5));animation:glow 6s ease-in-out infinite;will-change:filter}
@keyframes glow{0%,100%{filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}50%{filter:drop-shadow(0 10px 26px rgba(0,0,0,.5)) drop-shadow(0 0 28px rgba(255,220,120,.55))}}
.title{width:1480px;margin:8px 0 6px;animation:bob 7s ease-in-out infinite;will-change:transform}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-8px) rotate(-1.2deg)}}
.headline{font-size:50px;font-weight:700;letter-spacing:-.02em;text-shadow:0 3px 16px rgba(0,0,0,.5);display:flex;align-items:center;gap:14px}
.headline img{height:76px;position:relative;top:4px}
.sub{font-size:32px;font-weight:450;opacity:.95;text-shadow:0 2px 10px rgba(0,0,0,.45);margin-top:-8px}
.cta{display:flex;align-items:center;gap:26px;margin-top:6px}
.pill{background:#0d0d10;font-size:30px;font-weight:700;padding:18px 36px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px}
.dot{width:14px;height:14px;border-radius:50%;background:#ff3b5c;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.url{font-size:44px;font-weight:800;letter-spacing:-.01em;background:rgba(255,255,255,.96);color:#14051e;padding:12px 34px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.plat{display:flex;gap:20px;align-items:center}
.plat img{height:44px;width:44px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.plat img.x{height:36px;width:36px}
.mark{position:absolute;left:56px;bottom:44px;display:flex;flex-direction:column;gap:4px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.mark b{font-size:34px;font-weight:900;letter-spacing:.06em}
.mark span{font-size:18px;font-weight:600;letter-spacing:.22em;opacity:.85}
</style></head><body>
<div class="bg"></div><div class="scrim"></div><div class="sun"></div><div class="vig"></div>
<div class="col">
  <img class="logo" src="assets/brb/gta6irl_logo.png" alt="GTA6IRL.com">
  <img class="title" src="assets/brb/brb_title.png" alt="We'll be right back">
  <div class="headline">Kem is the official <img src="assets/brb/money.png" alt="money"> partner of GTA 6 IRL.</div>
  <div class="sub">Play, earn and cash out — live.</div>
  <div class="cta">
    <div class="pill"><i class="dot"></i>Live Nov 19</div>
    <div class="plat"><img src="assets/brb/platforms/youtube.svg"><img src="assets/brb/platforms/twitch.svg"><img src="assets/brb/platforms/kick.svg"></div>
  </div>
</div>
</body></html>
