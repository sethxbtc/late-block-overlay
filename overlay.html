<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>The Late Block on X Overlay</title>
<!--
  Kem livestream overlay — 1920x1080, transparent background (OBS Browser Source). v26: crispness pass (image-rendering, 2×+ rasters).
  URL params:  ?topic=Title&sub=Subtitle&kicker=Topic%201%20of%205  &ig=@handle  &theme=light (white bars; dark is default)
               &ticker=0 (hide ticker)  &lt=0 (hide topic)  &bar=0 (hide bottom bar)  &logo=0 (hide Late Block logo panel)  &tether=0 (hide the Powered by Tether tag, top left)  &frame=0 (no side gutters)
               &xbadge=0 (hide the Live on X pill, top right)  &clock=1 (show clock; off by default)  &pulse=0 (static LIVE dots)  &tz=Asia/Kuwait  &tzlabel=KWT (optional label; none by default)  &secs=1  &h24=1  &stores=0 (hide App Store / Google Play badges)  &preview=1 (test background)  &remote=0 (no ntfy remote)
  Topic set (v17): &t1=Title&s1=Subtitle ... &t4=&s4=  &slot=1..4  &auto=SECONDS (auto-rotate; 0/off by default)
  Centre (v18): &centre=promo|topic  (promo = Kem Card panel, the default; a URL ?centre= overrides the control page)
               &promo=Headline &promosub=Support line &promocta=Call to action  (message A; empty value hides that line)  &globe=0 (still globe)
  Promo (v21): ONE promo on a white panel (metal Kem card + Grok Bot characters); a second message only if &promob= is set (then they rotate).  &promosec=60 (seconds per message; 0 = no rotation)
               &promopin=1|2 (or a|b; pin one message)  &promob= &promobsub= &promobcta= (edit message B; a custom &promo= alone shows only A)
  Keys (when the source is focused via Interact, local only): 1-4 = slot, Right/N = next, Left/P = prev (these show the topic), C = promo/topic
  Live control: open control.html (same OBS, as a Custom Browser Dock) — it talks to this page
  through BroadcastChannel('kem-overlay') + localStorage('kem_overlay_state').
-->
<style>
@font-face{font-family:'KemInterTight';src:url('assets/fonts/InterTight.ttf') format('truetype');font-weight:100 900}
@font-face{font-family:'KemInter';src:url('assets/fonts/Inter.ttf') format('truetype');font-weight:100 900}
/* Flat, crisp, no shadows anywhere. Dark theme is default (v16); ?theme=light switches. */
:root{--tk:1; --g:12px; --bh:160px; --tt:66px;
  --gold-shine:linear-gradient(90deg,#C8921A 0%,#F5C542 18%,#FFE58A 32%,#F5C542 46%,#C8921A 60%,#F5C542 76%,#FFE58A 88%,#F5C542 100%);
  --gold-txt:#A8740F;
  --bg:#0B0B0C; --fg:#FFFFFF; --muted:#A1A1AA; --line:rgba(255,255,255,.12); --strip:#000000;
  --up:#34C77B; --down:#FF5A52; --flat:#A1A1AA; --sym:#F5C542;
}
body.light{--bg:#FFFFFF; --fg:#0B0B0C; --muted:#46464F; --line:rgba(11,11,12,.10); --strip:#F4F4F5;
  --up:#0A8A4A; --down:#D12F25; --flat:#71717A; --sym:#A8740F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent}
body{font-family:'KemInterTight','Inter Tight','KemInter','Inter',system-ui,sans-serif;color:var(--fg);position:relative;-webkit-font-smoothing:antialiased}
/* Keep photos smooth and SVGs geometrically sharp at 1920×1080 */
img{image-rendering:auto;-ms-interpolation-mode:bicubic}
img[src$=".svg"],svg{shape-rendering:geometricPrecision}
body.preview{background:#2b2a28}
body.preview.bd{background:url(assets/preview_backdrop.jpg) center/cover}
.ph{display:none}
body.preview:not(.bd) .ph{display:flex;position:absolute;left:var(--g);right:var(--g);top:calc(var(--tt) + 3px);bottom:calc(var(--bh) + 3px);border:2px dashed rgba(255,255,255,.2);border-radius:18px;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font:500 34px 'KemInter',sans-serif}
.shine{position:absolute;left:0;right:0;height:3px;background:var(--gold-shine)}

/* ---------- TOP TICKER ---------- */
#ticker{position:absolute;left:0;right:0;top:0;height:var(--tt);background:var(--bg);display:flex;align-items:center;transition:transform .5s ease}
#ticker .shine{bottom:-3px}
#ticker.hide{transform:translateY(-110%)}
/* top-left: POWERED BY tether, white on an ink block (reads on both themes), flush in the band */
#ticker .tt{flex:0 0 auto;height:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:0 36px 0 30px;background:#0B0B0C}
#ticker .tt span{font:600 14px/1 'KemInter',sans-serif;letter-spacing:.18em;color:#FFFFFF;white-space:nowrap;padding-top:2px}
#ticker .tt img{height:32px;width:auto;display:block}
body:not(.light) #ticker .tt{border-right:1px solid var(--line)}
body.notether #ticker .tt{display:none}
#ticker .bug{flex:0 0 auto;height:100%;display:flex;align-items:center;padding:0 18px 0 20px;border-right:1px solid var(--line)}
body.noclock #ticker .bug{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
body.nopulse #xbadge .d{animation:none;opacity:1}
@media (prefers-reduced-motion:reduce){body #xbadge .d{animation:none;opacity:1}}
#clock{display:flex;align-items:baseline;gap:9px;padding-left:4px;white-space:nowrap}
#clock .cl:empty{display:none}
#clock .cl{font:600 14px 'KemInter',sans-serif;letter-spacing:.08em;color:var(--sym)}
#clock .ct{font-weight:500;font-size:23px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--fg);display:inline-block;text-align:left}
body.noclock #clock{display:none}
#items{flex:1 1 auto;display:flex;justify-content:space-around;align-items:center;height:100%;overflow:hidden;white-space:nowrap}
.it{display:flex;align-items:baseline;gap:calc(6px*var(--tk));padding:0;transition:opacity .4s}
.it.stale{opacity:.55}
.it .sym{font:600 max(14px,calc(14px*var(--tk))) 'KemInter',sans-serif;letter-spacing:.08em;color:var(--sym)}
.it .px{font-weight:500;font-size:calc(23px*var(--tk));letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--fg)}
.it .ch{font:600 max(14px,calc(15px*var(--tk))) 'KemInter',sans-serif;font-variant-numeric:tabular-nums}
.ch.up{color:var(--up)} .ch.down{color:var(--down)} .ch.flat{color:var(--flat)}
.px.flash{animation:flash .9s}
@keyframes flash{0%{color:var(--sym)}100%{color:var(--fg)}}
/* v20: price update = digits roll like an odometer to the new value, then one soft gold glint. Static otherwise. */
.it .px{line-height:1.2}
.it .px .od{position:relative;display:inline-block;clip-path:inset(0 -1px)}
.it .px .od>b{visibility:hidden;font-weight:inherit}
.it .px .os{position:absolute;left:0;right:0;top:0;transform:translate3d(0,var(--a),0)}
.it .px .os i{display:block;height:1.2em;line-height:1.2em;font-style:normal;text-align:center}
.it .px.rolling .os{transform:translate3d(0,var(--b),0);transition:transform .8s cubic-bezier(.2,.75,.25,1)}
/* (glint) price update = one soft gold glint sweeping across the number (the value itself never moves) */
.it .px.shim{background:linear-gradient(100deg,var(--fg) 0%,var(--fg) 38%,var(--sym) 46%,var(--shim-hi,#FFE58A) 50%,var(--sym) 54%,var(--fg) 62%,var(--fg) 100%) 0 0/300% 100% no-repeat;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:pxShim 1.2s cubic-bezier(.3,0,.3,1) 1}
body.light{--shim-hi:#C8921A}
@keyframes pxShim{0%{background-position:100% 0}100%{background-position:0% 0}}
@media (prefers-reduced-motion:reduce){.it .px.shim{animation:none;background:none;color:var(--fg)}}
/* LIVE · Streaming exclusively on X: flush corner slot at the right end of the ticker band */
#ticker .xt{flex:0 0 auto;height:100%;display:flex;align-items:stretch}
/* full-height, flush corner block: confident X partnership slot (flat, no radius, no shadow) */
#xbadge{display:flex;align-items:center;gap:13px;height:100%;padding:0 24px 0 22px;background:#0B0B0C;color:#fff}
body:not(.light) #xbadge{background:#FFFFFF;color:#0B0B0C}
#xbadge .d{width:14px;height:14px;border-radius:50%;background:#E5342B;animation:pulse 2s ease-in-out infinite}
#xbadge .tx{font:800 18px/1.1 'KemInter',sans-serif;letter-spacing:.035em;white-space:nowrap}
#xbadge .tx b{display:block;font-weight:800;font-size:14px;letter-spacing:.2em;color:#FF4A40;margin-bottom:2px}
body:not(.light) #xbadge .tx b{color:#E5342B}
#xbadge .sp{width:1px;height:36px;background:currentColor;opacity:.25}
#xbadge img{height:34px;display:block}
body.noxbadge #ticker .xt{display:none}
body.scroll #items{justify-content:flex-start}
body.scroll #track{display:flex;gap:56px;animation:marq 40s linear infinite;padding-left:40px}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#track{display:contents}

/* ---------- FRAME (slim side gutters so the video sits inside the overlay) ---------- */
.gut{position:absolute;top:calc(var(--tt) + 3px);bottom:calc(var(--bh) + 3px);width:var(--g);background:var(--bg);transition:opacity .4s}
.gut.l{left:0} .gut.r{right:0}
body.noframe .gut,body.nobar .gut,body.notk .gut{opacity:0}

/* ---------- BOTTOM BLOCK (one flush lower third) ---------- */
#bbar{position:absolute;left:0;right:0;bottom:0;height:var(--bh);display:flex;align-items:stretch;background:var(--bg);color:var(--fg);
  transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#bbar .shine{top:-3px}
body.nobar #bbar{transform:translateY(110%)}
/* left: the show logo on its own (v23: "kem PRESENTS" removed), centred with equal room above and below */
#showlogo{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 50px;border-right:1px solid var(--line)}
#showlogo .wm{height:96px;width:auto;display:block}
body.nologo #showlogo{display:none}
/* centre: topic gets the full height of the block */
#lt{flex:1 1 auto;min-width:0;display:grid;grid-template:100%/100%;align-items:center;padding:0 48px;overflow:hidden}
#lt>.lyr{grid-area:1/1;min-width:0}
#lt>.lyr.off{visibility:hidden;opacity:0;pointer-events:none}
/* v19 centre promo: real-looking 3D Kem cards + live Earth (canvas). Flat bar, no drop shadows on the bar itself */
#promo{display:flex;align-items:center;gap:18px;height:100%;position:relative}
/* v21: one promo on the white panel: a black brushed-metal Kem card with the Grok Bot characters around it */
#promo .gb{position:relative;flex:0 0 auto;width:318px;height:160px;perspective:900px;perspective-origin:45% 40%;transition:opacity .4s linear}
#promo .fan{position:absolute;left:66px;top:24px;width:400px;height:252px;transform-style:preserve-3d;transform-origin:0 0;
  transform:scale(.47) rotateX(10deg) rotateY(-12deg);animation:fanSway 10s ease-in-out infinite alternate}
@keyframes fanSway{0%{transform:translate3d(0,1px,0) scale(.47) rotateX(13deg) rotateY(-17deg) rotateZ(-.8deg)}
  100%{transform:translate3d(0,-3px,0) scale(.47) rotateX(7deg) rotateY(-5deg) rotateZ(.8deg)}}
#promo .card{position:absolute;left:0;top:0;width:400px;height:252px;transform-style:preserve-3d;transform-origin:50% 60%}
#promo .k1{transform:rotateZ(-4deg)}
/* body thickness: dark slabs with a satin steel core = the bevelled metal edge */
#promo .slab{position:absolute;inset:0;border-radius:14.8px;background:#141416;transform:translate3d(calc(var(--z) * .6px),calc(var(--z) * 1.5px),calc(var(--z) * -2px))}
#promo .slab.z1{--z:.8;background:#3a3a3e} #promo .slab.z2{--z:1.6;background:linear-gradient(135deg,#f0f0f2,#8a8a90 35%,#e2e2e6 60%,#5e5e64)}
#promo .slab.z3{--z:2.4;background:linear-gradient(135deg,#9a9aa0,#4a4a4f 50%,#8c8c92)} #promo .slab.z4{--z:3.2;background:#1a1a1c}
#promo .face{position:absolute;inset:0;border-radius:14.8px;overflow:hidden;background:url(assets/kem_card_metal.png) center/100% 100% no-repeat;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20),inset 1.2px 2px 0 rgba(255,255,255,.30),inset -1px -2px 0 rgba(0,0,0,.85),inset 0 0 0 3px rgba(0,0,0,.18)}
/* v22: the face image is a 1200x756 procedural brushed-graphite plate (vector VISA / Signature / Kem mark, chamfered edge).
   .aniso clips the moving highlight to the brushed grain (kem_card_grain.png) so it breaks into fine horizontal streaks
   like a real anisotropic reflection; .face::after is a fixed softbox reflection in the top-right corner */
#promo .aniso{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;
  -webkit-mask:url(assets/kem_card_grain.png) 0 0/100% 100%;mask:url(assets/kem_card_grain.png) 0 0/100% 100%}
#promo .face::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(164deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.04) 22%,rgba(255,255,255,0) 23.5%),
    radial-gradient(120% 70% at 85% -10%,rgba(235,240,248,.07),rgba(235,240,248,0) 60%)}
/* moving reflection: a broad soft environment highlight that drifts with the tilt */
#promo .face::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:screen;
  background:linear-gradient(115deg,rgba(255,255,255,0) 18%,rgba(255,255,255,.10) 34%,rgba(255,255,255,.02) 46%,rgba(255,255,255,0) 60%,rgba(255,255,255,.06) 80%,rgba(255,255,255,0) 92%) 0 0/240% 100%;
  animation:gloss 10s ease-in-out infinite alternate}
@keyframes gloss{0%{background-position:0% 0}100%{background-position:80% 0}}
/* v25: soft specular bloom (no band): a wide diffuse radial highlight, low opacity, that drifts part-way across the card and breathes, 12 s ease-in-out */
#promo .sheen{position:absolute;z-index:3;top:-30%;left:-10%;width:70%;height:160%;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(ellipse 50% 45% at 50% 50%,rgba(240,244,250,.20) 0%,rgba(230,234,242,.09) 45%,rgba(255,255,255,0) 100%);
  transform:translate3d(0,0,0);animation:sheen 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sheen{0%{transform:translate3d(-5%,0,0);opacity:0}30%{opacity:.75}55%{transform:translate3d(55%,0,0);opacity:.9}80%{opacity:.35}100%{transform:translate3d(-5%,0,0);opacity:0}}
/* soft contact shadow on the white panel, breathing with the float */
#promo .cshadow{position:absolute;left:52px;top:120px;width:228px;height:36px;border-radius:50%;
  background:radial-gradient(42% 22% at 50% 40%,rgba(0,0,0,.42),rgba(0,0,0,0) 100%),
    radial-gradient(50% 50% at 50% 45%,rgba(0,0,0,.16),rgba(0,0,0,.06) 55%,rgba(0,0,0,0) 100%);filter:blur(2px);
  animation:cshadow 10s ease-in-out infinite alternate}
@keyframes cshadow{0%{transform:scale(1.02,1);opacity:1}100%{transform:scale(.94,.9);opacity:.75}}
body.light #promo .cshadow{display:none}
#promo .gb img{position:absolute;display:block;z-index:4;animation:gbob 3s ease-in-out infinite alternate;will-change:transform}
#promo .gb .bot{position:absolute;display:block;z-index:4;overflow:visible;transform-origin:50% 88%}
#promo .gb .g0{left:2px;top:78px;width:66px;height:66px}
body.light #promo .gb .g0{border-radius:50%;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
#promo .gb .gs{width:30px;height:30px}
#promo .gb .g1{left:20px;top:20px} #promo .gb .g2{left:274px;top:10px;width:32px;height:32px} #promo .gb .g3{left:288px;top:62px}
#promo .gb .g4{left:282px;top:112px} #promo .gb .g5{left:222px;top:132px;width:26px;height:26px} #promo .gb .g6{left:96px;top:132px;width:24px;height:24px}
@keyframes gbob{0%{transform:translate3d(0,1.5px,0)}100%{transform:translate3d(0,-2.5px,0)}}
@media (prefers-reduced-motion:reduce){#promo .fan,#promo .sheen,#promo .face::before,#promo .cshadow,#promo .gb img{animation:none}#promo .aniso{display:none}}
/* official Visa wordmark inline in the headline: height = cap height of the headline font, bottom on the baseline */
#promo .pHead .vis{display:inline-block;white-space:nowrap}
#promo .pHead .vis img{display:inline-block;height:.727em;width:auto;vertical-align:baseline;margin:0 .16em}
#promo .pHead .vis .vt{font-size:0;line-height:0}
body.light #promo .pHead .vis .vb,body:not(.light) #promo .pHead .vis .vw{display:none}
#promo .pHead .vis.noimg img{display:none} #promo .pHead .vis.noimg .vt{font-size:inherit;line-height:inherit}
#promo .pTxt{min-width:0;flex:1 1 auto;transition:transform .5s cubic-bezier(0,0,.2,1),opacity .5s linear}
#promo .pTxt.pout{opacity:0;transform:translate3d(0,-14px,0);transition:transform .4s cubic-bezier(.4,0,1,1),opacity .4s linear}
#promo .pTxt.ppre{opacity:0;transform:translate3d(0,16px,0);transition:none}
#promo .pHead{font-weight:700;font-size:var(--pf,40px);line-height:1.05;letter-spacing:-.03em;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#promo .pSub{font-weight:400;font-size:var(--psf,21px);line-height:1.3;letter-spacing:-.01em;color:var(--muted);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#promo .pSub:empty{display:none}
#promo .pCta{display:inline-block;margin-top:11px;font:700 16px/1 'KemInter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-txt);white-space:nowrap}
/* v22: the CTA is polished metallic gold: a deep vertical gold gradient (a darker reflection line just under the middle),
   v25: plus a very soft wide warm highlight that drifts slowly part-way over the letters (14 s, no line). Two background layers, clipped to the text */
#promo .pCta{--cg:linear-gradient(180deg,#E9C35C 0%,#C8962A 40%,#E6BE57 52%,#B7841C 70%,#F0CF74 100%);
  --cl:radial-gradient(ellipse 50% 90% at 50% 50%,rgba(255,248,225,.45) 0%,rgba(255,248,225,.18) 45%,rgba(255,255,255,0) 100%);
  background:var(--cl) 15% 0/70% 100% no-repeat,var(--cg) 0 0/100% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:ctaShine 14s ease-in-out infinite alternate}
@keyframes ctaShine{0%,20%{background-position:15% 0,0 0}100%{background-position:85% 0,0 0}}
@media (prefers-reduced-motion:reduce){#promo .pCta{animation:none;background:var(--cg);-webkit-background-clip:text;background-clip:text}}
#promo .pCta:empty{display:none}
/* promo B (v20): the Grok Bot app characters (assets/grokbot/*.svg, easy to swap) replace the cards + globe */
#lt{position:relative}
body[data-centre="promo"] #lt{padding:0 30px 0 30px}
/* v20: promo B turns the centre panel white (dark theme) so it stands out from the black bar; light theme inverts to black */
#lt{transition:background-color .6s ease}
body.promoW[data-centre="promo"] #lt:not(.hide){background:#FFFFFF}
body.light.promoW[data-centre="promo"] #lt:not(.hide){background:#0B0B0C}
body.promoW:not(.light) #promo .pHead{color:#0B0B0C}
body.promoW:not(.light) #promo .pSub{color:#4A4A52}
body.promoW:not(.light) #promo .pCta,body.light:not(.promoW) #promo .pCta{--cg:linear-gradient(180deg,#C8952A 0%,#9A6A0C 38%,#6A4200 50%,#8E5E08 62%,#C08A20 86%,#9C6A0E 100%);
  --cl:radial-gradient(ellipse 50% 90% at 50% 50%,rgba(233,184,74,.55) 0%,rgba(224,169,46,.22) 50%,rgba(224,169,46,0) 100%);
  filter:drop-shadow(0 .6px 0 rgba(84,52,0,.55))}   /* a crisp stamped edge keeps the letters legible on white while the soft shine drifts */
body.light.promoW #promo .pHead{color:#FFFFFF}
body.light.promoW #promo .pSub{color:#A1A1AA}

#promo.pout .gb{opacity:0}
#promo.ppre .gb{opacity:0;transition:none}
#lt.hide>.lyr{opacity:0;transition:opacity .4s}
#lt .txt{min-width:0;width:100%}
#lt .kicker{display:none;font:600 15px 'KemInter',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-txt);margin-bottom:5px;min-height:18px}
body:not(.light) #lt .kicker{color:#F5C542}
#lt .title{font-weight:600;font-size:var(--tf,50px);line-height:1.05;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lt .sub{font-weight:400;font-size:24px;line-height:1.3;letter-spacing:-.01em;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lt .sub:empty{display:none}
/* topic swap (v17): old text slides up and out (200ms), new text rises in (340ms). transform/opacity only = GPU, 60fps */
#lt .lyr{will-change:transform,opacity}
#lt .lyr.out{transform:translate3d(0,-18px,0);opacity:0;transition:transform .2s cubic-bezier(.4,0,1,1),opacity .2s linear}
#lt .lyr.pre{transform:translate3d(0,22px,0);opacity:0;transition:none}
#lt .lyr.inn{transition:transform .34s cubic-bezier(0,0,.2,1),opacity .34s linear}
@media (prefers-reduced-motion:reduce){
  #lt .lyr.out{transform:none;transition:opacity .15s linear}
  #lt .lyr.pre{transform:none}
  #lt .lyr.inn{transition:opacity .15s linear}
}
/* right: the Kem unit — logo + tagline + Instagram, with the official store badges beside them */
#kemu{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:30px;padding:0 36px 0 34px;border-left:1px solid var(--line)}
#kemu .grp{display:flex;align-items:center;gap:24px}
#kemu .kc{display:flex;flex-direction:column;align-items:flex-start}
#kemu .kl{height:36px;display:block}
#kemu .tg{font:500 16px/1 'KemInter',sans-serif;color:var(--muted);margin-top:10px;white-space:nowrap}
/* app store badges (official artwork, unmodified), stacked as a pair */
#kemu .stb{display:flex;flex-direction:column;gap:8px}

<script>
const IG_HANDLE='@kem';   // Instagram handle shown in the bottom bar (control page can override live)
(function(){
'use strict';
const Q=new URLSearchParams(location.search);
if(Q.get('preview')==='1')document.body.classList.add('preview');
if(Q.get('bd')==='1')document.body.classList.add('bd');
function setIg(h){const e=document.getElementById('ighandle');e.textContent=h;const w=e.closest('.igc');let f=23;w.style.setProperty('--igf',f+'px');
  while(f>16&&e.getBoundingClientRect().width>190){f-=.5;w.style.setProperty('--igf',f+'px')}}   // a long ?ig= handle shrinks a little
window.kemSetIg=setIg;setIg(Q.get('ig')||IG_HANDLE);if(document.fonts)document.fonts.ready.then(()=>setIg(document.getElementById('ighandle').textContent));
if(Q.get('bar')==='0')document.body.classList.add('nobar');
function setTheme(t){const L=t!=='dark';document.body.classList.toggle('light',L);
  const sw=(sel,a,b)=>{const e=document.querySelector(sel);if(e)e.src=L?a:b};
  sw('#showlogo .wm','assets/lb_stacked_ink.png','assets/lb_stacked_light.png');
  sw('#kemu .kl','assets/kem_logo_ink.png','assets/kem_logo_white.png');
  sw('#xbadge .xl','assets/x_logo_white.svg','assets/x_logo.svg')}
setTheme(Q.get('theme')||'dark');   // dark bars are the default (v16); ?theme=light for the white look
if(Q.get('scroll')==='1')document.body.classList.add('scroll');
if(Q.get('pulse')==='0')document.body.classList.add('nopulse');
if(Q.get('tether')==='0')document.body.classList.add('notether');
if(Q.get('frame')==='0')document.body.classList.add('noframe');

/* ================= CLOCK (local time, offline-safe via Intl) ================= */
(function clock(){
  if(Q.get('clock')!=='1'){document.body.classList.add('noclock');return}   // clock is off by default (v10); ?clock=1 opts in
  let tz=Q.get('tz')||'Asia/Kuwait';
  try{new Intl.DateTimeFormat('en-US',{timeZone:tz})}catch(e){tz='Asia/Kuwait'}
  const secs=Q.get('secs')==='1', h24=Q.get('h24')==='1';
  const lbl=(Q.get('tzlabel')||'').trim().toUpperCase();   // no label by default; ?tzlabel=KWT adds one
  document.getElementById('clockLbl').textContent=lbl;
  const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',second:secs?'2-digit':undefined,hour12:!h24,hourCycle:h24?'h23':undefined});
  const el=document.getElementById('clockTime');
  // reserve the widest possible string (e.g. "12:59:59 PM") so the box never changes width
  const probe=new Date(Date.UTC(2026,0,1,12,59,59));
  const wf=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',hour:'numeric',minute:'2-digit',second:secs?'2-digit':undefined,hour12:!h24,hourCycle:h24?'h23':undefined});
  const sizer=()=>{el.style.minWidth='';el.textContent=wf.format(probe).replace(/\u202f/g,' ');el.style.minWidth=Math.ceil(el.getBoundingClientRect().width)+'px'};
  const upd=()=>{el.textContent=f.format(new Date()).replace(/\u202f/g,' ')};
  sizer();upd();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{sizer();upd()});
  const loop=()=>{upd();setTimeout(loop,1000-(Date.now()%1000)+15)};   // tick right after each second boundary
  setTimeout(loop,1000-(Date.now()%1000)+15);
})();

/* ================= TICKER ================= */
const ITEMS=[
  {k:'BTC',  sym:'BTC',      fmt:v=>'$'+fmt(v,0)},
  {k:'SOL',  sym:'SOL',      fmt:v=>'$'+fmt(v,2)},
  {k:'HYPE', sym:'HYPE',     fmt:v=>'$'+fmt(v,2)},
  {k:'XAUT', sym:'XAUT · GOLD', fmt:v=>'$'+fmt(v,2)},   // Tether Gold, labelled as gold (single item)
  {k:'XAG',  sym:'SILVER',   fmt:v=>'$'+fmt(v,2)},
  {k:'USDT', sym:'USDT/USD', fmt:v=>fmt(v,4)},
];
const CACHE_KEY='kem_ticker_cache_v2';
let cache={};
try{cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')||{}}catch(e){cache={}}
const ok=n=>typeof n==='number'&&Number.isFinite(n);
function fmt(v,d){return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}
function set(k,price,chg){
  if(!ok(price)||price<=0)return;                 // never accept junk; keep last good value
  const prev=cache[k];
  cache[k]={p:price,c:ok(chg)?chg:(prev&&ok(prev.c)?prev.c:null),t:Date.now()};
}
function save(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache))}catch(e){}}

const track=document.getElementById('track');
const els={};
function build(){
  const mk=()=>ITEMS.map(it=>{
    const d=document.createElement('div');d.className='it';
    d.innerHTML='<span class="sym">'+it.sym+'</span><span class="px">—</span><span class="ch flat"></span>';
    track.appendChild(d);(els[it.k]=els[it.k]||[]).push(d);
  });
  mk(); if(document.body.classList.contains('scroll'))mk();   // duplicate for seamless marquee
}
function fit(){            // shrink ticker type if it ever overflows (never clip prices)
  if(document.body.classList.contains('scroll'))return;
  const box=document.getElementById('items');let k=1;document.documentElement.style.setProperty('--tk',k);
  // keep at least ~12px of air around every item (not just "no overflow"), shrinking in small steps
  const its=[...box.querySelectorAll('.it')];
  const tight=()=>box.scrollWidth>box.clientWidth||its.reduce((a,e)=>a+e.getBoundingClientRect().width,0)+its.length*12>box.clientWidth;
  while(tight()&&k>0.6){k-=0.01;document.documentElement.style.setProperty('--tk',k.toFixed(2))}
}
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
// odometer: each changed digit rolls (up if the price rose, down if it fell), then a brief gold glint
function rollPx(px,from,to){
  clearTimeout(px._rt);clearTimeout(px._sh);px.classList.remove('rolling','shim');
  if(RMQ.matches||document.hidden){px.textContent=to;return}
  const num=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0,up=num(to)>=num(from);
  const n=to.length,f=(from.length>=n?from.slice(-n):from.padStart(n,' '));let h='';
  for(let i=0;i<n;i++){const a=f[i],b=to[i];
    if(/\d/.test(b)&&a!==b){const s0=/\d/.test(a)?+a:0,e=+b,seq=[s0];let k=s0;
      while(k!==e){k=(k+(up?1:9))%10;seq.push(k)}
      const m=seq.length-1,list=up?seq:seq.slice().reverse();
      h+='<span class="od"><b>'+b+'</b><span class="os" style="--a:'+(up?0:-m*1.2)+'em;--b:'+(up?-m*1.2:0)+'em;transition-delay:'+((n-1-i)*35)+'ms">'+list.map(x=>'<i>'+x+'</i>').join('')+'</span></span>'}
    else h+=b===' '?'':b.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  px.innerHTML=h;void px.offsetWidth;requestAnimationFrame(()=>px.classList.add('rolling'));
  px._rt=setTimeout(()=>{px.classList.remove('rolling');px.textContent=to;void px.offsetWidth;px.classList.add('shim');
    px._sh=setTimeout(()=>px.classList.remove('shim'),1300)},1100);
}
function render(){
  const now=Date.now();
  ITEMS.forEach(it=>{
    const c=cache[it.k];
    (els[it.k]||[]).forEach(d=>{
      const px=d.children[1],ch=d.children[2];
      if(!c||!ok(c.p)){px.textContent='—';px.dataset.v='—';clearTimeout(px._rt);px.classList.remove('rolling');ch.textContent='';ch.className='ch flat';return}
      const txt=it.fmt(c.p);
      const was=px.dataset.v||px.textContent;
      if(was!==txt){if(was&&was!=='—')rollPx(px,was,txt);else px.textContent=txt;px.dataset.v=txt}
      if(ok(c.c)){
        const r=Math.round(c.c*100)/100;
        const cls=r>0?'up':r<0?'down':'flat';
        ch.className='ch '+cls;
        ch.textContent=(r>0?'▲ ':r<0?'▼ ':'')+Math.abs(r).toFixed(2)+'%';
      }else{ch.className='ch flat';ch.textContent=''}
      d.classList.toggle('stale',now-c.t>15*60*1000);   // dim if no fresh data for 15 min
    });
  });
  fit();
}

async function getJSON(url,ms){
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),ms||12000);
  try{const r=await fetch(url,{signal:ac.signal,cache:'no-store'});if(!r.ok)throw new Error(r.status);return await r.json()}
  finally{clearTimeout(to)}
}
async function firstJSON(urls){
  for(const u of urls){try{return await getJSON(u)}catch(e){console.warn('fail',u,e)}}
  return null;
}

// 1) Crypto + Tether Gold + USDT — CoinGecko (keyless, CORS *)
// Backoff: after a 429 or any error, wait 2, 4, 8 ... up to 15 minutes before asking that source again.
// Last good values stay on screen the whole time (and survive reloads via localStorage).
const BO={};
function due(k){return !BO[k]||Date.now()>=BO[k].next}
function okd(k){BO[k]={fail:0,next:0}}
function bad(k,e){const f=((BO[k]&&BO[k].fail)||0)+1;const wait=Math.min(15*60e3,60e3*Math.pow(2,f))*(0.85+Math.random()*0.3);
  BO[k]={fail:f,next:Date.now()+wait};console.warn(k,'failed ('+(e&&e.message||e)+'), retry in',Math.round(wait/1000),'s')}
async function crypto(){
  if(!due('cg'))return;
  try{
    const d=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,solana,hyperliquid,tether-gold,tether&vs_currencies=usd&include_24hr_change=true');
    const m={bitcoin:'BTC',solana:'SOL',hyperliquid:'HYPE','tether-gold':'XAUT',tether:'USDT'};
    let n=0;for(const id in m){const x=d&&d[id];if(x&&ok(x.usd)){set(m[id],x.usd,x.usd_24h_change);n++}}
    if(n)okd('cg');else bad('cg','empty');
  }catch(e){bad('cg',e)}
}
window.__kemBackoff=BO;

// Daily reference snapshots (fawazahmed0 currency-api via jsDelivr, Cloudflare mirror) — keyless, CORS *
const fxURL=tag=>['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@'+tag+'/v1/currencies/usd.min.json',
                  'https://'+tag+'.currency-api.pages.dev/v1/currencies/usd.min.json'];
let fxLatest=null, fxPrev=null, fxAt=0;
function ymd(d){return d.toISOString().slice(0,10)}
async function fxDaily(){
  if(Date.now()-fxAt<10*60*1000&&fxLatest&&fxPrev)return;
  // jsDelivr's @latest can lag a day on some edges, so ask both mirrors and keep the newest date
  const got=await Promise.all(fxURL('latest').map(u=>getJSON(u).catch(()=>null)));
  const L=got.filter(x=>x&&x.usd&&x.date).sort((x,y)=>x.date<y.date?1:-1)[0]||null;
  if(L&&L.usd){fxLatest=L;
    const base=new Date(L.date+'T00:00:00Z');base.setUTCDate(base.getUTCDate()-1);
    const P=await firstJSON(fxURL(ymd(base)));
    if(P&&P.usd)fxPrev=P;
    fxAt=Date.now();
  }
}
const pctv=(a,b)=>ok(a)&&ok(b)&&b>0?(a/b-1)*100:null;
const inv=v=>ok(v)&&v>0?1/v:null;

// 2) Gold & silver spot — gold-api.com (keyless, CORS *), 24h change vs previous-day reference
async function metalsFx(){
  if(!due('metals'))return;
  await fxDaily().catch(()=>{});
  const prevXAU=fxPrev&&inv(fxPrev.usd.xau), prevXAG=fxPrev&&inv(fxPrev.usd.xag);
  const [g,s]=await Promise.all([
    getJSON('https://api.gold-api.com/price/XAU').catch(()=>null),
    getJSON('https://api.gold-api.com/price/XAG').catch(()=>null)]);
  let xau=g&&g.price, xag=s&&s.price;
  if(ok(xau)||ok(xag))okd('metals');else bad('metals','no spot price');
  if(!ok(xau)&&fxLatest)xau=inv(fxLatest.usd.xau);   // fallback: daily reference
  if(!ok(xag)&&fxLatest)xag=inv(fxLatest.usd.xag);
  set('XAU',xau,pctv(xau,prevXAU));
  set('XAG',xag,pctv(xag,prevXAG));
  // XAUT fallback: if CoinGecko has no fresh Tether Gold price, show spot gold in the XAUT · GOLD slot
  const xt=cache.XAUT; if(!(xt&&ok(xt.p)&&Date.now()-xt.t<5*60*1000))set('XAUT',xau,pctv(xau,prevXAU));
}

async function tick(){
  await crypto();await metalsFx().catch(()=>{});   // crypto first so XAUT prefers CoinGecko over the spot-gold fallback
  save();render();
}
build();render();tick();
setInterval(tick,60*1000);
setInterval(render,30*1000);

/* ================= LOWER THIRD / CONTROL ================= */
const $=id=>document.getElementById(id);
const STATE_KEY='kem_overlay_state';
function fitTitle(){   // shrink the topic title (50px -> 30px) before it ever needs an ellipsis
  const t=$('title');if(!t)return;let f=50;t.style.setProperty('--tf',f+'px');
  const tw0=e=>{const r=document.createRange();r.selectNodeContents(e);return r.getBoundingClientRect().width};
  while(t.textContent&&tw0(t)>t.clientWidth-2&&f>30){f-=1;t.style.setProperty('--tf',f+'px')}
  // subtitle: shrink 24px -> 17px before it ever needs an ellipsis
  const u=$('sub');if(!u)return;let g=24;u.style.fontSize=g+'px';
  // measure the real (sub-pixel) text width: scrollWidth rounds, which can still leave an ellipsis
  const tw=()=>{const r=document.createRange();r.selectNodeContents(u);return r.getBoundingClientRect().width};
  while(u.textContent&&tw()>u.clientWidth-2&&g>17){g-=0.5;u.style.fontSize=g+'px'}
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitTitle());
const RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};
// which slot is live right now: fixed slot, or (auto-rotate) slot + whole intervals since the state was sent
function curSlot(s){
  const set=Array.isArray(s.set)?s.set:[];const order=[];set.forEach((x,i)=>{if(x&&x.t)order.push(i)});
  if(!order.length||!(s.slot>=0))return -1;
  let pos=order.indexOf(s.slot);if(pos<0)pos=0;
  const a=+s.auto||0;if(a>0&&order.length>1){pos=(pos+Math.max(0,Math.floor((Date.now()-(s.ts||Date.now()))/(a*1000))))%order.length}
  return order[pos];
}
function resolve(s){const i=curSlot(s);if(i>=0){const x=s.set[i];return {topic:x.t||'',sub:x.s||'',i}}return {topic:s.topic||'',sub:s.sub||'',i:-1}}
let cur=null, swapTok=0, centreTok=0;
function setTopic(t,sub,anim){
  const lt=$('lt'),txt=lt.querySelector('.txt');
  if($('title').textContent===t&&$('sub').textContent===sub){fitTitle();return}
  const tok=++swapTok;
  const put=()=>{$('title').textContent=t;$('sub').textContent=sub;fitTitle()};
  if(!anim||lt.classList.contains('hide')||document.hidden||txt.classList.contains('off')){if(!txt.classList.contains('off'))txt.classList.remove('out','pre','inn');put();return}
  txt.classList.remove('pre','inn');txt.classList.add('out');
  setTimeout(()=>{if(tok!==swapTok)return;
    put();txt.classList.remove('out');txt.classList.add('pre');void txt.offsetWidth;
    requestAnimationFrame(()=>{if(tok!==swapTok)return;txt.classList.remove('pre');txt.classList.add('inn');
      setTimeout(()=>{if(tok===swapTok)txt.classList.remove('inn')},400)});
  },RM.matches?150:200);
}
/* ---- centre content: Kem Card promo (default) or topic ---- */
// v19: the promo rotates between these messages. Edit the wording here.
// URL overrides: ?promo=&promosub=&promocta= (message A), ?promob=&promobsub=&promobcta= (message B); an empty value hides that line.
//   ?promosec=60 rotation interval in seconds (0 = no rotation)   ?promopin=1|2 (or a|b) pins one message
//   a custom ?promo= with no ?promob= shows only message A
const PROMOS=[
  {head:'Get your {VISA} AI Card with Kem',sub:'Pay for Grok Bot with your Kem card and earn up to 5% back.',cta:'Download Today',white:true}];
// optional second promo (rotation code kept): set it here, or per show with ?promob= &promobsub= &promobcta=
const PROMO_B=null;   // e.g. {head:'…',sub:'…',cta:'Download Today',white:true}
const PROMO_SEC=60;   // default seconds per message
const pv=(k,d)=>Q.has(k)?Q.get(k):d;
PROMOS[0]={...PROMOS[0],head:pv('promo',PROMOS[0].head),sub:pv('promosub',PROMOS[0].sub),cta:pv('promocta',PROMOS[0].cta)};
if(PROMO_B||Q.has('promob')){const d=PROMO_B||{head:'',sub:'',cta:PROMOS[0].cta,white:true};PROMOS[1]={...d,head:pv('promob',d.head),sub:pv('promobsub',d.sub),cta:pv('promobcta',d.cta)}}
const pinQ=(Q.get('promopin')||'').toLowerCase();
let promoPin=pinQ==='1'||pinQ==='a'?0:pinQ==='2'||pinQ==='b'?1:(Q.has('promo')&&!Q.has('promob')?0:-1);
const promoSec=Q.has('promosec')?Math.max(0,parseFloat(Q.get('promosec'))||0):PROMO_SEC;
if(promoPin>=PROMOS.length)promoPin=PROMOS.length-1;
let promoIdx=promoPin>=0?promoPin:0,promoAt=Date.now(),promoTok=0;
// headline: {VISA} becomes the official Visa wordmark (blue on the white panel, white on the dark panel), sized to the
// cap height and sitting on the baseline; the word "Visa" stays in the text (hidden) and shows if the image can't load
function setHead(e,t){e.textContent='';String(t).split('{VISA}').forEach((part,k)=>{if(k){const w=document.createElement('span');w.className='vis';
    w.innerHTML='<img class="vb" src="assets/visa_logo_blue.svg" alt=""><img class="vw" src="assets/visa_logo_white.svg" alt=""><span class="vt">Visa</span>';
    w.querySelectorAll('img').forEach(m=>{m.addEventListener('error',()=>w.classList.add('noimg'));m.addEventListener('load',()=>fitPromo())});e.appendChild(w)}
    e.appendChild(document.createTextNode(part))})}
function putPromo(i){const p=PROMOS[i];setHead($('ph'),p.head);$('ps').textContent=p.sub;$('pc').textContent=p.cta;
  document.body.classList.toggle('promoW',!!p.white);$('promo').dataset.msg=i===1?'b':'a';fitPromo()}
function showPromo(i,anim){
  i=((i%PROMOS.length)+PROMOS.length)%PROMOS.length;promoAt=Date.now();if(i===promoIdx&&$('ph').textContent)return;promoIdx=i;
  const t=$('promo').querySelector('.pTxt'),tok=++promoTok;
  const pr=$('promo'),els=[t,pr];
  if(!anim||document.hidden||centreNow!=='promo'){els.forEach(e=>e.classList.remove('pout','ppre'));putPromo(i);return}
  els.forEach(e=>e.classList.add('pout'));
  setTimeout(()=>{if(tok!==promoTok)return;putPromo(i);els.forEach(e=>{e.classList.remove('pout');e.classList.add('ppre')});void t.offsetWidth;
    requestAnimationFrame(()=>{if(tok===promoTok)els.forEach(e=>e.classList.remove('ppre'))})},RM.matches?150:420);

try{const bc=new BroadcastChannel('kem-overlay');bc.onmessage=e=>{if(e.data&&e.data.type==='state')apply(e.data.state,true);if(e.data&&e.data.type==='ping')bc.postMessage({type:'pong'})}}catch(e){}
window.addEventListener('storage',e=>{if(e.key===STATE_KEY&&e.newValue){try{apply(JSON.parse(e.newValue),true)}catch(_){}}});

/* ================= REMOTE CONTROL (signed messages over ntfy.sh) ================= */
const REMOTE={"topic": "kemlb_348451b98956ddf7cc39d227", "pub": {"key_ops": ["verify"], "ext": true, "kty": "EC", "x": "ef-09TNtuCsvlCg2U2FsVwBXuOEXoiz5Mbhwp3H_YRA", "y": "VSNlhHevfOdImN3qChKkYJfGpR9X3EyxRPt9c69p-54", "crv": "P-256"}};
let lastTs=(saved&&saved.ts)||0, vkey=null;
const enc=new TextEncoder(), unb64=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function verify(m){
  try{const o=JSON.parse(m);if(!o||!o.s||!o.sig)return;
    vkey=vkey||await globalThis.crypto.subtle.importKey('jwk',REMOTE.pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const good=await globalThis.crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},vkey,unb64(o.sig),enc.encode(JSON.stringify(o.s)));
    if(!good||!(o.s.ts>lastTs))return; lastTs=o.s.ts;
    try{localStorage.setItem(STATE_KEY,JSON.stringify(o.s))}catch(e){}
    apply(o.s,true);
  }catch(e){}
}
const NT='https://ntfy.sh/'+REMOTE.topic;
async function pollAll(){try{const r=await fetch(NT+'/json?poll=1&since=12h',{cache:'no-store'});const t=await r.text();
  for(const l of t.trim().split('\n')){if(!l)continue;const e=JSON.parse(l);if(e.event==='message')await verify(e.message)}}catch(e){}}
if(Q.get('remote')!=='0'){
  // live stream of signed messages; reconnects by itself after drops (error -> retry with backoff,
  // silent stall -> watchdog, network back -> immediate reconnect), and re-polls so nothing is missed
  let es=null, beat=Date.now(), tries=0, timer=null;
  const RS={state:'connecting',reconnects:0};window.__kemRelay=RS;
  const open=()=>{
    clearTimeout(timer);try{es&&es.close()}catch(_){}
    RS.state='connecting';es=new EventSource(NT+'/sse');
    es.onopen=()=>{beat=Date.now();tries=0;RS.state='open'};
    es.onmessage=ev=>{beat=Date.now();try{const e=JSON.parse(ev.data);if(e.event==='message')verify(e.message)}catch(_){}};
    es.addEventListener('keepalive',()=>{beat=Date.now()});
    es.onerror=()=>{try{es.close()}catch(_){}RS.state='retrying';const wait=Math.min(30000,2000*Math.pow(1.6,tries++));
      clearTimeout(timer);timer=setTimeout(()=>{RS.reconnects++;pollAll();open()},wait)};
  };
  pollAll().then(open);
  setInterval(()=>{if(Date.now()-beat>120000){beat=Date.now();RS.reconnects++;pollAll();open()}},15000);   // stalled stream
  window.addEventListener('online',()=>{tries=0;RS.reconnects++;pollAll();open()});
  setInterval(pollAll,60000);   // safety net
}
window.kemOverlay={rollPx:(i,from,to)=>{const p=document.querySelectorAll('.it .px')[i];rollPx(p,from,to);p.dataset.v=to},apply,resolve,state:()=>cur,cache:()=>cache,tick,centre:()=>centreNow,promo:()=>promoIdx,showPromo:i=>showPromo(i,true),PROMOS};
})();
</script>
